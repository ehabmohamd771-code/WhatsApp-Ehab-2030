
name: Build WhatsApp Ehab 2030

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare isolated Android SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          SDK_ROOT="$RUNNER_TEMP/android-sdk"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          mkdir -p "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-25" \
            "build-tools;25.0.0"

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Build APK
        run: |
          chmod +x gradlew
          bash gradlew --no-daemon assembleDebug

      - name: Check APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Ehab-2030-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
